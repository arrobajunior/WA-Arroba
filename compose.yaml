name: whatsapp-api
services:
  app:
    build: .
    init: true
    restart: unless-stopped
    environment:
      PUBLIC_URL: https://${APP_DOMAIN:?Defina APP_DOMAIN no arquivo .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Defina ADMIN_EMAIL no arquivo .env}
      ADMIN_PASSWORD_FILE: /run/secrets/admin_password
    secrets:
      - admin_password
    volumes:
      - app_data:/app/data
    ports:
      - "127.0.0.1:3210:3210"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  proxy:
    image: caddy:2
    profiles: [gateway]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Defina APP_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
secrets:
  admin_password:
    file: ./secrets/admin_password.txt
volumes:
  app_data:
  caddy_data:
  caddy_config:
